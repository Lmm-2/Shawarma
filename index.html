<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مطعم الشاورما المنزلي 🌯</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #d97706; /* برتقالي ذهبي دافئ ومشهي */
      --primary-hover: #b45309;
      --bg-color: #fdfbf7; /* خلفية فاتحة ونظيفة */
      --card-bg: #ffffff;
      --text-main: #2d3748;
      --accent-soft: #fffbeb;
      --border-color: #fde68a;
    }

    * {
      box-sizing: border-box;
      font-family: 'Cairo', sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 480px;
      padding: 35px 28px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(217, 119, 6, 0.08);
      border: 1.5px solid var(--border-color);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, #f59e0b, #d97706, #b45309);
    }

    /* صفحة الترحيب */
    .welcome-screen {
      text-align: center;
    }

    .welcome-screen h1 {
      color: #1a202c;
      margin-bottom: 12px;
      font-size: 1.9rem;
      font-weight: 800;
    }

    .welcome-screen p {
      color: #4a5568;
      margin-bottom: 30px;
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .emoji-banner {
      font-size: 4.5rem;
      margin-bottom: 15px;
      display: inline-block;
    }

    /* النموذج */
    .form-screen {
      display: none;
    }

    .form-title {
      text-align: center;
      margin-bottom: 25px;
      color: #1a202c;
      font-weight: 800;
      font-size: 1.5rem;
    }

    .section-title {
      font-weight: 700;
      margin: 20px 0 12px;
      color: var(--primary);
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .option-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
      margin-bottom: 15px;
    }

    .option-group label {
      background: var(--accent-soft);
      border: 1.5px solid #fef3c7;
      padding: 12px 10px;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.25s ease;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      color: #78350f;
    }

    .option-group input:checked + span {
      color: #fff;
    }

    .option-group label:has(input:checked) {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 4px 12px rgba(217, 119, 6, 0.25);
      transform: translateY(-2px);
    }

    .option-group input {
      display: none;
    }

    .input-field {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid #e2e8f0;
      background: #f8fafc;
      border-radius: 14px;
      margin-top: 5px;
      margin-bottom: 15px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      border-color: var(--primary);
      background: #fff;
    }

    .btn {
      width: 100%;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 14px;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 6px 18px rgba(217, 119, 6, 0.25);
      margin-top: 15px;
    }

    .btn:hover {
      background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(217, 119, 6, 0.35);
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- الشاشة الترحيبية -->
    <div id="welcomeScreen" class="welcome-screen">
      <div class="emoji-banner">🌯✨</div>
      <h1>أهلاً بكم في شاورما اليوم!</h1>
      <p>جهّزت لكم أطيب شاورما منزلية.. اختاروا تفاصيل ساندويتشكم المفضلة ليصلني طلبكم مباشرة!</p>
      <button class="btn" onclick="startOrder()">بدء اختيار الطلب 👈</button>
    </div>

    <!-- نموذج الطلب -->
    <div id="formScreen" class="form-screen">
      <h2 class="form-title">تخصيص الساندويتش 🥙</h2>
      
      <form id="shawarmaForm">
        <!-- الاسم -->
        <label style="font-weight: 700; color: #334155;">الاسم الكريم:</label>
        <input type="text" id="userName" class="input-field" placeholder="اكتب اسمك هنا..." required>

        <!-- نوع الخبز -->
        <div class="section-title">1. نوع الخبز:</div>
        <div class="option-group">
          <label><input type="radio" name="bread" value="تورتيلا" checked><span>تورتيلا</span></label>
          <label><input type="radio" name="bread" value="صاج / شراك"><span>صاج / شراك</span></label>
          <label><input type="radio" name="bread" value="خبز عادي (مسرح)"><span>خبز عادي</span></label>
        </div>

        <!-- الإضافات -->
        <div class="section-title">2. الإضافات داخل الساندويتش:</div>
        <div class="option-group">
          <label><input type="checkbox" name="addons" value="مخلل"><span>مخلل 🥒</span></label>
          <label><input type="checkbox" name="addons" value="بطاطا"><span>بطاطا 🍟</span></label>
          <label><input type="checkbox" name="addons" value="دقوس (حار)"><span>دقوس حار 🌶️</span></label>
        </div>

        <!-- الصوصات -->
        <div class="section-title">3. الثومية:</div>
        <div class="option-group" style="grid-template-columns: 1fr 1fr;">
          <label><input type="radio" name="garlic" value="مع ثومية" checked><span>مع ثومية 🧄</span></label>
          <label><input type="radio" name="garlic" value="بدون ثومية"><span>بدون ثومية</span></label>
        </div>

        <!-- ملاحظات -->
        <div class="section-title">ملاحظات إضافية (اختياري):</div>
        <input type="text" id="notes" class="input-field" placeholder="مثال: اكتر ثومية، كبس زيادة...">

        <button type="button" class="btn" onclick="sendToWhatsApp()">إرسال الطلب عبر الواتساب 📲</button>
      </form>
    </div>
  </div>

  <script>
    // استبدلي الرقم أدناه برقم هاتفكِ (مع المفتاح الدولي بدون علامة +)
    const myPhoneNumber = "971505089503"; 

    function startOrder() {
      document.getElementById('welcomeScreen').style.display = 'none';
      document.getElementById('formScreen').style.display = 'block';
    }

    function sendToWhatsApp() {
      const name = document.getElementById('userName').value.trim();
      if (!name) {
        alert("لطفاً اكتب اسمك أولاً!");
        return;
      }

      // نوع الخبز
      const bread = document.querySelector('input[name="bread"]:checked').value;

      // الإضافات
      const addons = Array.from(document.querySelectorAll('input[name="addons"]:checked'))
                        .map(cb => cb.value);
      const addonsText = addons.length > 0 ? addons.join('، ') : 'بدون إضافات';

      // الثومية
      const garlic = document.querySelector('input[name="garlic"]:checked').value;

      // الملاحظات
      const notes = document.getElementById('notes').value.trim() || 'لا يوجد';

      // نص الرسالة
      const message = `طلب شاورما جديد 🌯✨%0A%0A` +
                      `👤 *الاسم:* ${name}%0A` +
                      `🥖 *نوع الخبز:* ${bread}%0A` +
                      `🥗 *الإضافات:* ${addonsText}%0A` +
                      `🧄 *الثومية:* ${garlic}%0A` +
                      `📝 *ملاحظات:* ${notes}`;

      const whatsappUrl = `https://wa.me/${myPhoneNumber}?text=${message}`;
      window.open(whatsappUrl, '_blank');
    }
  </script>

</body>
</html>
